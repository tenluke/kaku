name: CI

# Runs on every push and pull request, so problems show up before merging.
on:
  push:
    branches: [main]
  pull_request:

# Only needs to read the code.
permissions:
  contents: read

# Actions are pinned to an exact commit, with the version it belongs to as a comment: a version
# tag such as "v7" can be moved to different code later, a commit cannot.
jobs:
  check:
    # Pinned so the next Ubuntu switch happens when we choose, not mid-release.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The same checks as `npm run check` (package.json): keep the two lists the same.
      # Fails if any library has a known security problem.
      - run: npm run audit
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The single offline file must keep building. On pull requests it is
      # attached to the run ("Artifacts" on the run's page), so it can be tried before merging.
      - run: npm run build:single
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: kaku-offline-file
          path: dist-single/index.html
          retention-days: 14
