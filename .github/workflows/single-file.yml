name: Single offline file

# After every change on main, build the single offline file and publish it in two releases:
# - "Latest build": always the newest file. Its download link never changes:
#     https://github.com/tenluke/kaku/releases/download/latest/kaku.html
# - "Version x.y.z": made once, the first time main has that version in package.json, and
#   then kept, so older versions stay available.
# The text of both lists the SHA-256 checksum of every published file.
on:
  push:
    branches: [main]
  workflow_dispatch: # also allows running it by hand from the Actions tab

# Nothing is published unless every check passes (`npm run check`: audit, format, lint, tests
# and both builds).
#
# Two jobs, so that the code from npm and the build never run with write access:
# - build:   may only read the repository. Installs, checks, builds, and hands over the files.
# - publish: may write releases. Runs no code from the repository, only GitHub's release tool.
permissions: {}

# If two merges happen quickly, only the newest build is published.
concurrency:
  group: single-file
  cancel-in-progress: true

jobs:
  build:
    # Pinned so the Ubuntu 26 switch happens when we choose, not mid-release.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.text.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Every file in release/ is published and gets a checksum.
      - run: mkdir release && cp dist-single/index.html release/kaku.html
      - name: Write the release text
        id: text
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "Single offline file of 書く, version $version, built from commit ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)."
            echo
            echo "Download kaku.html and open it in a browser: it works without internet."
            echo "Progress is saved in the browser you open it with. Keep the file in one place; to move"
            echo "progress (also to or from the website), use ⋯ → Backup & transfer."
            echo
            echo "### SHA-256 checksums"
            echo
            echo '```'
            (cd release && sha256sum -- *)
            echo '```'
            echo
            echo "To check a download, compare with the output of \`sha256sum kaku.html\` (Linux),"
            echo "\`shasum -a 256 kaku.html\` (macOS) or \`Get-FileHash kaku.html\` (Windows PowerShell)."
          } > release-notes.md
          cat release-notes.md
      # Hand the files to the publish job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            release/
            release-notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the releases; nothing else is written
    env:
      GH_TOKEN: ${{ github.token }}
      # This job has no copy of the repository, so the release tool is told which one it is.
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
      - name: Publish as the "latest" release
        run: |
          # Replace the previous "latest" release, so the link always gives the newest file.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest release/* \
            --title "Latest build" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --notes-file release-notes.md
      - name: Publish the version's own release, once
        run: |
          # A version's release is never replaced, so its files and checksums stay as they were.
          # To publish a new one, raise the version in package.json.
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists: it is kept as it is."
          else
            gh release create "v$VERSION" release/* \
              --title "Version $VERSION" \
              --target "$GITHUB_SHA" \
              --latest \
              --notes-file release-notes.md
          fi
