name: Website

# After every change on main, build the website and publish it on GitHub Pages:
#   https://tenluke.github.io/kaku/
# One-time setup in the repository: Settings → Pages → Source → "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch: # also allows running it by hand from the Actions tab

# Nothing is published unless every check passes (`npm run check`: audit, format, lint, tests
# and both builds).
#
# Two jobs, so that the code from npm and the build never run with publishing rights:
# - build:  may only read the repository. Installs, checks, builds, and hands over the website.
# - deploy: may publish to GitHub Pages. Runs no code from the repository.
permissions: {}

# If two merges happen quickly, they are published one after the other. A publish that has
# started is never cancelled, so the website is not left half updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write # publish the website
      id-token: write # prove to GitHub Pages that the files come from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
